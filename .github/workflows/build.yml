name: build
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: scaffold
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/push-notifications @capacitor/share
          mkdir www
          echo '<!doctype html><meta http-equiv="refresh" content="0;url=https://muslimsshopping.com">' > www/index.html
          echo '{"appId":"com.muslimsshopping.app","appName":"Muslims Shopping","webDir":"www","server":{"url":"https://muslimsshopping.com","allowNavigation":["muslimsshopping.com","*.muslimsshopping.com"]}}' > capacitor.config.json
          npx cap add android
          curl -sL https://muslimsshopping.com/pwa-512.png -o icon.png
      - name: build debug apk
        run: |
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: scaffold
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/ios
          mkdir www
          echo '<!doctype html><meta http-equiv="refresh" content="0;url=https://muslimsshopping.com">' > www/index.html
          echo '{"appId":"com.muslimsshopping.app","appName":"Muslims Shopping","webDir":"www","server":{"url":"https://muslimsshopping.com","allowNavigation":["muslimsshopping.com","*.muslimsshopping.com"]}}' > capacitor.config.json
          npx cap add ios
      - name: compile for simulator
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
